<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentic-os fleet</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #667085; --line: #e3e6eb;
  --ok: #1a7f37; --bad: #c62828; --warn: #b54708; --warn-bg: #fff4e5; --accent: #3b5bdb; --chip: #eef1f5;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1216; --panel: #171b21; --ink: #e6e8eb; --muted: #8b95a3; --line: #262c35;
    --ok: #3fb950; --bad: #f85149; --warn: #f0a24a; --warn-bg: #2a1f10; --accent: #7c93ff; --chip: #212730; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: baseline; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
header .meta { color: var(--muted); font-size: 12px; }
.conn { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--bad); margin-right: 6px; }
.conn.on { background: var(--ok); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px 20px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 0 8px; }
.inbox { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; }
.inbox:empty { display: none; }
.inbox code { font-family: var(--mono); font-size: 12px; background: var(--panel); padding: 2px 6px; border-radius: 4px; }
.inbox div + div { margin-top: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card.awaiting { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn) inset; }
.card.err { border-color: var(--bad); }
.row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.name { font-weight: 600; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.run { background: var(--accent); color: #fff; }
.pill.wait { background: var(--warn); color: #fff; }
.pill.bad { background: var(--bad); color: #fff; }
.title { margin: 6px 0; overflow-wrap: anywhere; }
.gates { display: flex; gap: 4px; margin: 8px 0; }
.gate { flex: 1; text-align: center; font-size: 10px; padding: 3px 0; border-radius: 4px; background: var(--chip); color: var(--muted); }
.gate.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.gate.here { outline: 2px solid var(--accent); outline-offset: -2px; }
.small { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.small a { color: var(--accent); }
.feed { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-height: calc(100vh - 120px); overflow: auto; }
.ev { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
.ev time { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.ev b { font-weight: 600; }
.ev.bad b { color: var(--bad); } .ev.wait b { color: var(--warn); } .ev.good b { color: var(--ok); }
dialog { width: min(1000px, calc(100vw - 32px)); height: min(85vh, 900px); border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--ink); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.dlg { display: flex; flex-direction: column; height: 100%; }
.dlg header { position: sticky; top: 0; }
.tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; }
.tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.close { margin-left: auto; }
pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--mono); }
.body { flex: 1; overflow: auto; padding: 12px 16px; }
.md { max-width: 860px; line-height: 1.55; }
.md h3 { font-size: 18px; margin: 4px 0 10px; } .md h4 { font-size: 15px; margin: 18px 0 6px; } .md h5 { font-size: 13px; margin: 14px 0 4px; }
.md p { margin: 6px 0; } .md ul, .md ol { margin: 4px 0; padding-left: 22px; } .md li { margin: 2px 0; }
.md code { font-family: var(--mono); font-size: 12px; background: var(--chip); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--chip); padding: 8px 10px; border-radius: 6px; margin: 6px 0; }
.md li.task { list-style: none; margin-left: -18px; }
.md pre.comment { border-left: 3px solid var(--warn); opacity: .85; }
pre.raw { font-size: 12.5px; }
.toggle { display: flex; gap: 4px; margin-top: 8px; }
.toggle .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.msg.warn { background: var(--warn-bg); border: 1px solid var(--warn); }
.diff .note { color: var(--warn); font-weight: 600; } .diff .add { color: var(--ok); } .diff .del { color: var(--bad); } .diff .hunk { color: var(--accent); } .diff .file { font-weight: 600; }
.approve { max-width: 860px; }
.approve .doc { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 10px 0; max-height: 45vh; overflow: auto; }
.approve form { display: grid; gap: 8px; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.approve input, .approve textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.approve textarea { min-height: 80px; resize: vertical; }
.approve .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
.btn.primary { background: var(--ok); border-color: var(--ok); color: #fff; } .btn.warn { background: var(--warn); border-color: var(--warn); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.msg { font-size: 13px; padding: 6px 10px; border-radius: 6px; } .msg.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); } .msg.err { background: color-mix(in srgb, var(--bad) 15%, transparent); }
.fb { border-left: 3px solid var(--warn); padding: 4px 10px; margin: 6px 0; white-space: pre-wrap; }
ul.missing { margin: 4px 0 0 16px; padding: 0; }
</style>
</head>
<body>
<header>
  <h1>agentic-os fleet</h1>
  <span class="meta"><span id="conn" class="conn"></span><span id="summary">cargando…</span></span>
  <span class="meta" id="updated"></span>
</header>
<main>
  <section>
    <div class="inbox" id="inbox"></div>
    <h2>Proyectos</h2>
    <div class="grid" id="grid"></div>
  </section>
  <aside>
    <h2>Actividad</h2>
    <div class="feed" id="feed"></div>
  </aside>
</main>

<dialog id="dlg">
  <div class="dlg">
    <div class="tabs" id="tabs"></div>
    <div id="body" class="body"></div>
  </div>
</dialog>

<script>
'use strict';
const PHASES = ['plan', 'build', 'review', 'test', 'ship'];
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : String(k));
  return n;
};
const ago = (iso) => {
  if (!iso) return '';
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  return s < 60 ? `hace ${s}s` : s < 3600 ? `hace ${Math.round(s / 60)}m` : s < 86400 ? `hace ${Math.round(s / 3600)}h` : `hace ${Math.round(s / 86400)}d`;
};
let projects = [];

async function refresh() {
  try {
    const r = await fetch('/api/fleet');
    const data = await r.json();
    projects = data.projects;
    render();
    $('updated').textContent = `actualizado ${new Date(data.generatedAt).toLocaleTimeString()}`;
  } catch (e) {
    $('summary').textContent = `error: ${e.message}`;
  }
}

function status(p) {
  if (p.error) return ['error', 'bad'];
  if (!p.enabled) return ['deshabilitado', ''];
  if (p.paused) return ['pausado', 'bad'];
  if (p.awaiting) return [`espera tu firma: ${p.awaiting}`, 'wait'];
  if (p.lastDecision?.action === 'paused') return ['pausado', 'bad'];
  if (p.task) return [p.task.phase, 'run'];
  return ['inactivo', ''];
}

function render() {
  const waiting = projects.filter((p) => p.awaiting);
  const active = projects.filter((p) => p.task).length;
  $('summary').textContent = `${projects.length} proyectos · ${active} con tarea activa · ${waiting.length} esperan tu aprobación`;

  $('inbox').replaceChildren(...(waiting.length ? [el('h2', {}, 'Necesita tu aprobación')] : []),
    ...waiting.map((p) => el('div', {},
      el('button', { class: 'btn warn', onclick: () => open(p.name, null, 'approve') }, `Revisar ${p.awaiting}`), ' ',
      el('b', {}, p.name), ` — ${p.task.title} `,
      el('span', { class: 'small' }, ' o en el server: '),
      el('code', {}, `cd ${p.path} && .governance/bin/gov approve ${p.awaiting}`))));

  $('grid').replaceChildren(...projects.map((p) => {
    const [label, cls] = status(p);
    const reason = p.error || p.pausedReason || (p.lastDecision?.action === 'paused' || p.lastDecision?.action === 'idle' ? p.lastDecision.reason : null);
    return el('div', { class: `card ${p.awaiting ? 'awaiting' : ''} ${p.error ? 'err' : ''}`, onclick: () => open(p.name) },
      el('div', { class: 'row' }, el('span', { class: 'name' }, p.name), el('span', { class: `pill ${cls}` }, label)),
      p.task ? el('div', { class: 'title' }, p.task.title) : el('div', { class: 'title small' }, 'sin tarea activa'),
      p.gates ? el('div', { class: 'gates' }, PHASES.map((ph) =>
        el('span', { class: `gate ${p.gates[ph].ok ? 'ok' : ''} ${p.task.phase === ph ? 'here' : ''}`, title: p.gates[ph].missing.join('\n') || 'ok' }, ph))) : null,
      p.asanaTask ? el('div', { class: 'small' }, 'Asana: ', /^https:\/\//.test(p.asanaTask.url || '') ? el('a', { href: p.asanaTask.url, target: '_blank', rel: 'noopener', onclick: (e) => e.stopPropagation() }, p.asanaTask.name) : p.asanaTask.name) : null,
      el('div', { class: 'small' }, `cola: ${p.queue.length}`, p.queueError ? ` (error Asana: ${p.queueError})` : '',
        p.lastRun ? ` · última ejecución ${ago(p.lastRun.at)} ${p.lastRun.ok ? '✔' : '✘'} ${Math.round(p.lastRun.durationMs / 1000)}s` : ''),
      reason ? el('div', { class: 'small' }, reason) : null);
  }));
}

function evLine(e) {
  const map = {
    'run-start': ['', `inicia ${e.action}${e.phase ? ` (${e.phase})` : ''}${e.asanaTask ? ` — ${e.asanaTask}` : ''}`],
    'run-end': [e.ok ? 'good' : 'bad', `terminó ${e.action}: ${e.ok ? 'ok' : `falló (exit ${e.exitCode}${e.timedOut ? ', timeout' : ''})`} en ${Math.round(e.durationMs / 1000)}s`],
    'awaiting-human': ['wait', `espera \`gov approve ${e.gate}\``],
    'paused': ['bad', `pausado: ${e.reason}`],
    'asana-error': ['bad', `Asana: ${e.error}`],
    'task-closed': ['good', `tarea cerrada ${e.taskId}`],
    'skipped-locked': ['', 'omitido: ya hay un agente corriendo'],
    'tick': ['', `ciclo del supervisor (${(e.projects || []).length} proyectos)`],
    'pause': ['bad', `pausado por humano`], 'resume': ['good', 'reanudado por humano'],
    'approved': ['good', `${e.gate} aprobado desde la UI`],
    'changes-requested': ['wait', 'cambios pedidos al plan'],
    'approval-denied': ['bad', `aprobación rechazada: ${e.reason}`],
    'recovered-interrupted-start': ['', 'recuperado un inicio interrumpido'],
  };
  const [cls, msg] = map[e.type] || ['', e.type];
  return el('div', { class: `ev ${cls}` }, el('time', {}, new Date(e.at).toLocaleString()), ' ',
    e.project ? el('b', {}, e.project) : null, ' ', msg,
    e.runId ? el('div', {}, el('a', { href: '#', onclick: (ev) => { ev.preventDefault(); open(e.project, e.runId); } }, 'ver log')) : null);
}

function connect() {
  const src = new EventSource('/api/events');
  let t;
  src.onopen = () => $('conn').classList.add('on');
  src.onerror = () => $('conn').classList.remove('on');
  src.onmessage = (m) => {
    const e = JSON.parse(m.data);
    $('feed').prepend(evLine(e));
    while ($('feed').children.length > 300) $('feed').lastChild.remove();
    clearTimeout(t); t = setTimeout(refresh, 500);
  };
}

// Claude's stream-json log → readable transcript; anything unparseable is shown as-is.
function formatLog(raw) {
  return raw.split('\n').map((line) => {
    let j; try { j = JSON.parse(line); } catch { return line; }
    if (j.type === 'assistant' && j.message?.content) {
      return j.message.content.map((c) => c.type === 'text' ? `🤖 ${c.text}` : c.type === 'tool_use' ? `🔧 ${c.name} ${JSON.stringify(c.input).slice(0, 400)}` : '').filter(Boolean).join('\n');
    }
    if (j.type === 'user' && Array.isArray(j.message?.content)) {
      return j.message.content.filter((c) => c.type === 'tool_result').map((c) => {
        const t = Array.isArray(c.content) ? c.content.map((x) => x.text || '').join('') : String(c.content ?? '');
        return `   ↳ ${t.slice(0, 600).replace(/\n/g, '\n     ')}`;
      }).join('\n');
    }
    if (j.type === 'result') return `\n== resultado: ${j.subtype || ''} ${j.result ? `\n${j.result}` : ''}`;
    if (j.type === 'system') return `· ${j.subtype || 'system'}`;
    return '';
  }).filter(Boolean).join('\n');
}

// ---------------------------------------------------------------- markdown → DOM (textContent only, never innerHTML)
function inline(text) {
  const out = [];
  for (const part of String(text).split(/(`[^`]+`|\*\*[^*]+\*\*)/)) {
    if (!part) continue;
    if (part.startsWith('`') && part.endsWith('`') && part.length > 1) out.push(el('code', {}, part.slice(1, -1)));
    else if (part.startsWith('**') && part.endsWith('**') && part.length > 3) out.push(el('strong', {}, part.slice(2, -2)));
    else out.push(document.createTextNode(part));
  }
  return out;
}

function md(src) {
  const root = el('div', { class: 'md' });
  // HTML comments are invisible in rendered markdown but are part of what gets approved: show them, marked.
  const comments = [];
  const lines = String(src)
    .replace(/\u0000/g, '\uFFFD') // only fleet's own comment markers may contain NUL
    .replace(/<!--[\s\S]*?-->/g, (m) => { comments.push(m); return `\n\u0000C${comments.length - 1}\n`; })
    .split('\n');
  const unmark = (t) => t.replace(/\u0000C(\d+)/g, (m, n) => comments[+n]);
  let list = null;
  let para = null;
  const endBlocks = () => { list = null; para = null; };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const cm = line.match(/^\u0000C(\d+)$/);
    if (cm) {
      root.append(el('pre', { class: 'comment', title: 'Comentario HTML: invisible en markdown normal, pero es parte de lo que apruebas' }, comments[+cm[1]]));
      endBlocks();
      continue;
    }
    if (/^\s*```/.test(line)) {
      // The whole block, fence lines included: text on them is part of the document too.
      const code = [line];
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) code.push(lines[i]);
      if (i < lines.length) code.push(lines[i]);
      root.append(el('pre', {}, unmark(code.join('\n'))));
      endBlocks();
      continue;
    }
    if (/^\s*\|/.test(line)) {
      const rows = [line];
      while (i + 1 < lines.length && /^\s*\|/.test(lines[i + 1])) rows.push(lines[++i]);
      root.append(el('pre', {}, rows.join('\n')));
      endBlocks();
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      root.append(el(`h${Math.min(h[1].length + 2, 6)}`, {}, ...inline(h[2])));
      endBlocks();
      continue;
    }
    const li = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (li) {
      const ordered = /\d/.test(li[2]);
      if (!list || list.ordered !== ordered) {
        list = { node: el(ordered ? 'ol' : 'ul'), ordered };
        root.append(list.node);
      }
      para = null;
      const item = el('li', { style: `margin-left:${Math.min(Math.floor(li[1].length / 2), 6) * 16}px` });
      const box = li[3].match(/^\[( |x|X)\]\s+(.*)$/);
      if (box) {
        const cb = el('input', { type: 'checkbox', disabled: '' });
        cb.checked = box[1] !== ' ';
        item.className = 'task';
        item.append(cb, ' ', ...inline(box[2]));
      } else item.append(...inline(li[3]));
      list.node.append(item);
      continue;
    }
    if (!line.trim()) {
      endBlocks();
      continue;
    }
    if (list && /^\s{2,}\S/.test(line)) {
      list.node.lastChild.append(' ', ...inline(line.trim()));
      continue;
    }
    list = null;
    if (!para) {
      para = el('p');
      root.append(para);
    } else para.append(' ');
    para.append(...inline(line.trim()));
  }
  return root;
}

// Characters that render as nothing, reorder text, or can smuggle hidden text (controls, format
// characters incl. bidi/zero-width/tag characters, private use, unassigned, lone surrogates, variation
// selectors, fillers, line/paragraph separators): shown as ⟦U+XXXX⟧. Tab, LF and CR stay as they are.
const INVISIBLE = /(?![\t\n\r])[\p{Cc}\p{Cf}\p{Co}\p{Cn}\p{Cs}\p{Zl}\p{Zp}\p{Variation_Selector}\p{Default_Ignorable_Code_Point}\u2800\u034F\u115F\u1160\u3164\uFFA0\u180B-\u180F\u{1D173}-\u{1D17A}]/gu;
const reveal = (text) => String(text).replace(INVISIBLE, (c) => `⟦U+${c.codePointAt(0).toString(16).toUpperCase().padStart(4, '0')}⟧`);
const countInvisible = (text) => (String(text).match(INVISIBLE) || []).length;

/** The document exactly as stored: every character, nothing interpreted. */
function rawView(text) {
  return el('pre', { class: 'raw' }, reveal(text));
}

/** gov's patch format. Lines are classified by position, not by look: content can't pose as a file header. */
function diffView(raw) {
  const out = el('pre', { class: 'diff' });
  let state = 'list'; // list (A/M/D lines) → header (after `diff --gov`) → hunk (after `@@`)
  for (const line of String(raw).split('\n')) {
    let cls = '';
    if (line.startsWith('diff --gov ')) (state = 'header'), (cls = 'file');
    else if (state === 'list') cls = line ? 'file' : '';
    else if (state === 'header' && line.startsWith('@@')) (state = 'hunk'), (cls = 'hunk');
    else if (state === 'header') cls = line.startsWith('note:') ? 'note' : 'file';
    else if (line.startsWith('@@')) cls = 'hunk';
    else if (line.startsWith('+')) cls = 'add';
    else if (line.startsWith('-')) cls = 'del';
    // CR is revealed here (a CRLF→LF change must not look like an unchanged line)
    const text = reveal(line).replace(/\r/g, '⟦U+000D⟧');
    out.append(cls ? el('span', { class: cls }, text) : document.createTextNode(text), '\n');
  }
  return out;
}

const pre = (t) => el('pre', {}, t);

/** A document under approval: exact text by default (every character, invisibles revealed), formatted on request. */
function docViewer(text) {
  const doc = el('div', { class: 'doc' });
  const n = countInvisible(text);
  const warn = n ? el('div', { class: 'msg warn' }, `Contiene ${n} carácter(es) invisible(s) o de control; en "texto exacto" se muestran como ⟦U+XXXX⟧.`) : null;
  const views = { exact: () => rawView(text), formatted: () => md(text) };
  const toggle = el('div', { class: 'toggle' });
  const pick = (v) => {
    doc.replaceChildren(views[v]());
    [...toggle.children].forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  };
  toggle.append(
    el('button', { type: 'button', class: 'btn', 'data-v': 'exact', onclick: () => pick('exact') }, 'Texto exacto'),
    el('button', { type: 'button', class: 'btn', 'data-v': 'formatted', onclick: () => pick('formatted') }, 'Vista formateada'),
  );
  pick('exact');
  return [warn, toggle, doc].filter(Boolean);
}

// ---------------------------------------------------------------- approval panel
async function approvePanel(p) {
  const info = await getJSON(`/api/projects/${encodeURIComponent(p.name)}/approval`);
  const box = el('div', { class: 'approve' });
  if (info.error) {
    box.append(el('div', { class: 'msg err' }, info.error));
    return box;
  }
  const pend = info.pending;
  if (!pend) {
    box.append(el('p', {}, 'Nada espera tu aprobación en este proyecto ahora mismo.'));
    return box;
  }

  box.append(el('h3', {}, pend.gate === 'plan' ? `Aprobar plan: ${pend.title}` : `Aprobar ship: ${pend.title}`));
  if (pend.gate === 'plan') {
    box.append(el('div', { class: 'small' }, 'Este es el plan exacto que vas a aprobar. Si cambia aunque sea un byte, la aprobación se rechaza.'));
    const planText = String(info.document || '');
    const nComments = (planText.match(/<!--/g) || []).length;
    if (nComments) {
      box.append(el('div', { class: 'msg warn' }, `El plan tiene ${nComments} comentario(s) HTML: no se ven en markdown normal, pero son parte de lo que apruebas.`));
    }
    box.append(...docViewer(planText));
    box.append(el('div', { class: 'small' }, `sha256 del plan: ${pend.expect.slice(0, 16)}…`));
  } else {
    box.append(el('p', {}, 'Build, review y test tienen evidencia sobre este árbol. Abajo está exactamente lo que apruebas: el diff, la revisión y la verificación, leídos juntos con el fingerprint. Aprobar ship no publica nada: el push y el PR siguen siendo tuyos.'));
    const sh = info.ship || {};
    box.append(el('h4', {}, 'Diff'));
    if (sh.diffTooLarge) {
      box.append(el('div', { class: 'msg err' }, 'El diff es demasiado grande para revisarlo aquí completo. Apruébalo en una terminal del server después de revisarlo.'));
      return box;
    }
    const nDiffInvisible = countInvisible(sh.diff || '');
    if (nDiffInvisible) box.append(el('div', { class: 'msg warn' }, `El diff contiene ${nDiffInvisible} carácter(es) invisible(s) o de control, mostrados como ⟦U+XXXX⟧.`));
    box.append(el('div', { class: 'doc' }, diffView(sh.diff || '(sin cambios)')));
    box.append(el('h4', {}, 'Review'), ...docViewer(sh.review || '(sin review.md)'));
    box.append(el('h4', {}, 'Verification'), ...docViewer(sh.verification || '(sin verification.md)'));
    box.append(el('div', { class: 'small' }, `fingerprint del árbol: ${pend.expect.slice(0, 16)}…`));
  }
  if (p.feedback && p.feedback.length) {
    box.append(el('h4', {}, 'Cambios pedidos antes'));
    for (const f of p.feedback) {
      const label = { pending: 'pendiente: el agente revisará el plan', addressed: 'atendido: el plan cambió', superseded: 'reemplazado: el plan se aprobó', returned: 'devuelto: el agente no cambió el plan' }[f.status] || f.status;
      box.append(el('div', { class: 'fb' }, el('div', { class: 'small' }, `${new Date(f.at).toLocaleString()} · ${label}`), f.text));
    }
  }
  if (!info.enabled || !info.supported) {
    box.append(el('div', { class: 'msg err' }, `No se puede aprobar desde la UI: ${info.reason}`));
    return box;
  }

  const msg = el('div', {});
  const pass = el('input', { type: 'password', autocomplete: 'off', placeholder: 'passphrase', 'aria-label': 'passphrase' });
  const comment = pend.gate === 'plan' ? el('textarea', { placeholder: 'Qué debe cambiar en el plan (para pedir cambios)', maxlength: '4000' }) : null;
  const buttons = [];
  const submit = async (action) => {
    const body = action === 'approve'
      ? { gate: pend.gate, expect: pend.expect, passphrase: pass.value }
      : { text: comment.value, expect: pend.expect, passphrase: pass.value };
    pass.value = ''; // never kept around, never stored
    buttons.forEach((b) => (b.disabled = true));
    msg.replaceChildren(el('div', { class: 'msg' }, 'enviando…'));
    try {
      const r = await fetch(`/api/projects/${encodeURIComponent(p.name)}/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const j = await r.json().catch(() => ({}));
      msg.replaceChildren(el('div', { class: `msg ${r.ok ? 'ok' : 'err'}` }, r.ok ? `✔ ${j.message}` : `✘ ${j.error || r.status}`));
      if (r.ok) {
        if (comment) comment.value = '';
        refresh();
        return;
      }
    } catch (e) {
      msg.replaceChildren(el('div', { class: 'msg err' }, `✘ ${e.message}`));
    }
    buttons.forEach((b) => (b.disabled = false));
  };
  const approveBtn = el('button', { type: 'button', class: 'btn primary', onclick: () => submit('approve') }, pend.gate === 'plan' ? 'Aprobar plan' : 'Aprobar ship');
  buttons.push(approveBtn);
  const actions = el('div', { class: 'actions' }, approveBtn);
  if (comment) {
    const fbBtn = el('button', {
      type: 'button',
      class: 'btn warn',
      onclick: () => (comment.value.trim() ? submit('feedback') : msg.replaceChildren(el('div', { class: 'msg err' }, 'Escribe qué debe cambiar.'))),
    }, 'Pedir cambios');
    buttons.push(fbBtn);
    actions.append(fbBtn);
  }
  box.append(el('form', { onsubmit: (e) => e.preventDefault() }, pass, comment, actions, msg));
  return box;
}

// ---------------------------------------------------------------- detail dialog
let logTimer;
function open(name, runId, start) {
  const p = projects.find((x) => x.name === name);
  if (!p) return;
  const q = encodeURIComponent(name);
  const tabs = [];
  if (p.awaiting) tabs.push({ id: 'approve', label: `aprobar ${p.awaiting}`, load: () => approvePanel(p) });
  tabs.push({ id: 'status', label: 'estado', load: async () => pre(overview(p)) });
  if (p.task) {
    for (const d of ['plan', 'review', 'verification']) {
      tabs.push({ id: d, label: d, load: () => fetchDoc(`/api/projects/${q}/files/${d}`) });
    }
    if (p.task.phase !== 'plan') tabs.push({ id: 'diff', label: 'diff', load: () => get(`/api/projects/${q}/diff`).then(diffView) });
  }
  const rid = runId || (p.lastRun && p.lastRun.runId);
  if (rid) {
    tabs.push({ id: 'log', label: runId ? `log ${rid.slice(0, 19)}` : 'último log', load: () => get(`/api/runs/${q}/${encodeURIComponent(rid)}/log`).then((t) => pre(formatLog(t))), live: true });
  }
  const show = (i) => {
    clearInterval(logTimer);
    [...$('tabs').querySelectorAll('button[data-i]')].forEach((b) => b.classList.toggle('on', +b.dataset.i === i));
    const { load, live } = tabs[i];
    const body = $('body');
    const go = () => load()
      .then((node) => {
        const atEnd = body.scrollTop + body.clientHeight >= body.scrollHeight - 20;
        body.replaceChildren(node);
        if (live && atEnd) body.scrollTop = body.scrollHeight;
      })
      .catch((e) => body.replaceChildren(pre(`(${e.message})`)));
    body.replaceChildren(pre('cargando…'));
    go();
    if (live) logTimer = setInterval(go, 3000);
  };
  $('tabs').replaceChildren(el('b', { style: 'align-self:center;margin-right:8px' }, name),
    ...tabs.map((t, i) => el('button', { 'data-i': i, onclick: () => show(i) }, t.label)),
    el('button', { class: 'close', onclick: () => $('dlg').close() }, 'cerrar'));
  $('dlg').showModal();
  const want = runId ? 'log' : start || (p.awaiting ? 'approve' : 'status');
  show(Math.max(0, tabs.findIndex((t) => t.id === want)));
}
$('dlg').addEventListener('close', () => clearInterval(logTimer));

async function get(url) {
  const r = await fetch(url);
  const t = await r.text();
  if (!r.ok) {
    try { return `(${JSON.parse(t).error})`; } catch { return `(${r.status})`; }
  }
  return t;
}

async function fetchDoc(url) {
  const r = await fetch(url);
  const t = await r.text();
  if (r.ok) return md(t);
  let e = r.status;
  try { e = JSON.parse(t).error; } catch {}
  return pre(`(${e})`);
}

async function getJSON(url) {
  const r = await fetch(url);
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  return r.ok ? j : { error: j.error || `HTTP ${r.status}` };
}

function overview(p) {
  const lines = [`Proyecto: ${p.name}`, p.error ? `Error: ${p.error}` : null,
    p.task ? `Tarea: ${p.task.title}\nID: ${p.task.id}\nFase: ${p.task.phase}   archivos cambiados: ${p.changed}` : 'Sin tarea activa',
    p.asanaTask ? `Asana: ${p.asanaTask.name} ${p.asanaTask.url || ''}` : null,
    p.paused ? `PAUSADO: ${p.pausedReason || ''}` : null,
    p.lastDecision ? `Última decisión: ${p.lastDecision.action}${p.lastDecision.reason ? ` — ${p.lastDecision.reason}` : ''} (${ago(p.lastDecision.at)})` : null,
    `Fallos consecutivos: ${p.consecutiveFailures}`, ''];
  if (p.gates) for (const ph of PHASES) {
    lines.push(`${p.gates[ph].ok ? '✔' : '✘'} ${ph}${p.task.phase === ph ? '  ◀' : ''}`);
    for (const m of p.gates[ph].missing) lines.push(`    · ${m}`);
  }
  lines.push('', `Cola Asana (${p.queue.length}):`, ...p.queue.map((t) => `  - ${t.name}${t.url ? `  ${t.url}` : ''}`));
  return lines.filter((l) => l !== null).join('\n');
}

refresh();
connect();
setInterval(refresh, 15000);
